schema_version: 1
id: LX001
title: Users and permissions
goal: Configure a shared operations directory using Linux users, groups, and mode bits.
instructions: |
  Work on node as student, using sudo for administration.

  1. Create group `labops` and user `opsadmin`.
  2. Add `opsadmin` to `labops` as a supplementary member, so both
     `getent group labops` and `id -nG opsadmin` show the membership.
  3. Create `/srv/labshare` as `opsadmin:labops` with mode `2770`.
  4. Create `/srv/labshare/operations.txt` as `opsadmin:labops` with mode `0660`.

  Preserve the setgid directory bit so new files inherit the shared group.

  ## Grading

  Run `labctl grade LX001` on the host where labctl is installed, not inside
  the learner VM.
provider: kvm
grader: grade.py
vms:
  - name: node
    cpus: 1
    ram: 1GiB
    disk: 12GiB
    image: rocky:9
    hostname: lx001.lab
    interfaces:
      - type: isolated_nat
    setup: setup.sh
    depends_on: []
    ssh_user: student
