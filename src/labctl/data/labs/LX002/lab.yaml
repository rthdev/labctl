schema_version: 1
id: LX002
title: Files, links, and text processing
goal: Organize files and prove link semantics while producing a deterministic text report.
instructions: |
  Work on node with the staged records in `/srv/lx002/source/records.txt`.
  The parent `/srv/lx002` is student-owned; the archive directory is not staged.
  Create `/srv/lx002/archive` and `/srv/lx002/archive/records.hard` as a hard
  link to that source file: the files must share the same inode. Create
  `/home/student/current-records` as a symbolic link resolving to the source file.

  Use text-processing tools to count records by severity. Write exactly these
  sorted lines to `/srv/lx002/report.txt`:

  ```text
  ERROR 2
  INFO 2
  WARN 2
  ```

  Set the report ownership to `student:student` and mode `0640`.

  ## Grading

  Run `labctl grade LX002` on the host where labctl is installed, not inside
  the learner VM.
provider: kvm
grader: grade.py
vms:
  - name: node
    cpus: 1
    ram: 1GiB
    disk: 12GiB
    image: rocky:9
    hostname: lx002.lab
    interfaces:
      - type: isolated_nat
    setup: setup.sh
    depends_on: []
    ssh_user: student
