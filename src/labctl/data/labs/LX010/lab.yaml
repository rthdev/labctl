schema_version: 1
id: LX010
title: Shell navigation and file operations
goal: Build a small workspace using navigation, copying, moving, and redirection.
instructions: |
  Work on node as student. Use sudo only for administration; level 0 tasks need no sudo.

  ## Starting state

  The read-only source /srv/lx010/welcome.txt contains exactly Welcome to Rocky 10 followed by a newline. /home/student/lx010 does not exist.

  ## Required outcomes

  1. Create real directories `/home/student/lx010/notes` and `/home/student/lx010/inbox`.
  2. Copy the source to `/home/student/lx010/notes/welcome.txt`; it must be a regular non-symlink file with identical bytes.
  3. Create `/home/student/lx010/.ready` containing exactly `ready` and a newline.
  4. Use shell navigation and output redirection to save the absolute notes directory path, followed by a newline, in `/home/student/lx010/location.txt`.

  ## Persistence and forbidden shortcuts

  Keep all required files until grading. No reboot is required.
  Forbidden shortcuts: do not alter source fixtures, grader assets, or management access.
  Do not replace required regular files with symlinks or fabricate command output.
  This is an outcome-based practice lab, not a root-tamper security boundary.

  ## Grading

  Run `labctl grade LX010` on the host, not in the VM. Each check reports PASS or FAIL.
provider: kvm
grader: grade.py
vms:
  - name: node
    cpus: 1
    ram: 1GiB
    disk: 12GiB
    image: rocky:10
    hostname: lx010.lab
    interfaces:
      - type: isolated_nat
    setup: setup.sh
    depends_on: []
    ssh_user: student
