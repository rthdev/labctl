schema_version: 1
id: LX110
title: Local accounts and scoped privilege
goal: Create a local operator identity with group access and narrowly delegated sudo.
instructions: |
  Work on node as student. Use sudo only for administration; level 0 tasks need no sudo.

  ## Starting state

  User lxoperator, group lxteam, and /srv/lx110-share are absent. Student retains management sudo. Do not change student.

  ## Required outcomes

  1. Create local user `lxoperator` with home `/home/lxoperator`, login shell `/bin/bash`, and a locked password (no password login needed).
  2. Create group `lxteam` and add lxoperator as a supplementary member, visible through both getent group and id.
  3. Set lxoperator password maximum age to 45 days and warning to 7 days using chage.
  4. Create real directory `/srv/lx110-share`, owner root:lxteam, mode `2770`.
  5. Configure valid sudo policy allowing lxoperator to run only `/usr/bin/id -u` as root without a password (use an explicit root run-as identity); running `/usr/bin/cat /etc/shadow` must not be allowed. Do not grant wheel membership or unrestricted sudo. Validate with visudo.
  These are persistent account and policy changes; no reboot is required.

  ## Persistence and forbidden shortcuts

  Keep all required files until grading. No reboot is required.
  Forbidden shortcuts: do not alter source fixtures, grader assets, or management access.
  Do not replace required regular files with symlinks or fabricate command output.
  This is an outcome-based practice lab, not a root-tamper security boundary.

  ## Grading

  Run `labctl grade LX110` on the host, not in the VM. Each check reports PASS or FAIL.
provider: kvm
grader: grade.py
vms:
  - name: node
    cpus: 1
    ram: 1GiB
    disk: 12GiB
    image: rocky:10
    hostname: lx110.lab
    interfaces:
      - type: isolated_nat
    setup: setup.sh
    depends_on: []
    ssh_user: student
