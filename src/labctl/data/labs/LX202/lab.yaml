schema_version: 1
id: LX202
title: Scheduled jobs and system maintenance
goal: Implement durable, observable maintenance using a persistent systemd timer.
instructions: |
  Work on node. Replace the unreliable manual task with an executable maintenance
  program at `/usr/local/sbin/lx202-maintenance`. It must remove
  `/var/tmp/lx202-cache/stale.tmp` and write exactly `maintenance complete` to
  `/var/log/lx202-maintenance.log`.

  Create `lx202-maintenance.service` with these exact service directives:

  ```ini
  Type=oneshot
  ExecStart=/usr/local/sbin/lx202-maintenance
  ```

  Create and enable/start `lx202-maintenance.timer`, targeting that service.
  Schedule it daily at 02:15 with `OnCalendar=02:15` (the full
  `OnCalendar=*-*-* 02:15:00` form is also accepted) and `Persistent=true` to
  recover missed runs. Leave the timer enabled and active.

  Trigger the service once to provide completion evidence. The grader also stages
  a fresh stale file, removes the old log, and starts the service: your program
  must handle new input correctly rather than relying on a one-time manual cleanup.

  ## Grading

  Run `labctl grade LX202` on the host where labctl is installed, not inside
  the learner VM.
provider: kvm
grader: grade.py
vms:
  - name: node
    cpus: 1
    ram: 1GiB
    disk: 12GiB
    image: rocky:9
    hostname: lx202.lab
    interfaces:
      - type: isolated_nat
    setup: setup.sh
    depends_on: []
    ssh_user: student
