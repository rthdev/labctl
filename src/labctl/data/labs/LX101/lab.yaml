schema_version: 1
id: LX101
title: Packages, services, and logs
goal: Install and operate a managed web service with persistent system logs.
instructions: |
  Work on node using package and service management tools. Install `httpd`,
  enable and start it, and publish exactly `LX101 healthy` at
  `http://127.0.0.1/health`.

  Configure journald persistent storage using
  `/etc/systemd/journald.conf.d/lx101.conf` with `Storage=persistent` in the
  `[Journal]` section. The effective configuration must use persistent storage,
  and `/var/log/journal` must contain httpd unit records, not merely exist.
  Use `systemctl`, `systemd-analyze cat-config systemd/journald.conf`, and
  `sudo journalctl --directory=/var/log/journal -u httpd` to verify operation.

  ## Grading

  Run `labctl grade LX101` on the host where labctl is installed, not inside
  the learner VM.
provider: kvm
grader: grade.py
vms:
  - name: node
    cpus: 1
    ram: 1GiB
    disk: 12GiB
    image: rocky:9
    hostname: lx101.lab
    interfaces:
      - type: isolated_nat
    setup: setup.sh
    depends_on: []
    ssh_user: student
