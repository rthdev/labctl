schema_version: 1
id: CT101
title: Publish a rootless web service
goal: Publish a container web service on an explicitly loopback-bound rootless port.
instructions: |
  Create running `ct101-web` from `registry.access.redhat.com/ubi9/httpd-24:9.8`. Serve
  `CT101 rootless web` (newline allowed) at `/index.html` on TCP 8080 in the
  container and publish exactly `127.0.0.1:8080:8080`.

  No objective container exists initially. Use rootless Podman as `student` and
  the preloaded mutable-tag image. Do not use sudo, privileged mode, a host web
  server, or a wildcard host bind. Grading correlates inspect port state with a
  request executed in `ct101-web`; it does not contact a registry.
  The UBI Apache image runs as UID 1001 and defaults to `/usr/bin/run-httpd`,
  which configures Apache for non-root port 8080. Write `/var/www/html/index.html`
  (not `/opt/app-root/src/index.html`) before `exec /usr/bin/run-httpd` in a shell
  command, or bind a readable prepared document root with an SELinux label.
  Use `curl --noproxy '*' -fsS` for probes; the base image has no web server.
  The grader probes both the container-local endpoint and the host loopback port.

  Fresh creation refreshes the required UBI 9.8 minor tags, even if cached.
  Resolved image IDs and repository digests are recorded for diagnostics in
  `/var/lib/labctl/ct-image-provenance`; these are observations, not digest pins.
  Grading never pulls. A reset reuses the saved definition/setup and rebuilds
  guest storage, so its saved tags can resolve to newer bytes. Recreate the lab
  to adopt an updated catalogue; a reset does not migrate old assignments.

  ## Common environment and boundaries
  One Rocky Linux 9 VM named `node` is supplied. Work as `student` using rootless
  Podman and `registry.access.redhat.com/ubi9/httpd-24:9.8` (preloaded in your image store).
  Use `--pull=never` for offline runs. Package/image acquisition during setup needs
  Internet; the upstream image tag is mutable, not digest-pinned. No host container
  engine is used. Keep SELinux confinement intact; never use privileged containers,
  rootful Podman, disabled labels, host networking, or host-service substitutes.
  No guest reboot is required for this lab. Leave all requested evidence in place.
  From the labctl host, run `labctl lab grade CT101` to check your work.
provider: kvm
grader: grade.py
vms:
  - {name: node, cpus: 1, ram: 1GiB, disk: 12GiB, image: 'rocky:9', hostname: ct101.lab, interfaces: [{type: isolated_nat}], setup: setup.sh, depends_on: [], ssh_user: student}
