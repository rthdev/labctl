schema_version: 1
id: LX301
title: Secure web service with SELinux
goal: Serve nonstandard web content by adding narrow persistent SELinux policy.
instructions: |
  Configure httpd to serve /srv/secureweb on TCP port 8088.
  Add persistent SELinux port and file-context mappings and apply the labels.
  Enable and start httpd while SELinux remains enforcing.
  Do not disable SELinux; follow /home/student/LAB.md.
provider: kvm
grader: grade.py
vms:
  - name: node
    cpus: 1
    ram: 2GiB
    disk: 12GiB
    image: rocky:9
    hostname: lx301.lab
    interfaces:
      - type: isolated_nat
    setup: setup.sh
    depends_on: []
    ssh_user: student
