schema_version: 1
id: CT402
title: Recover a rootless container incident
goal: Diagnose and repair a staged rootless API port mismatch while preserving named-volume data and evidence.
instructions: |
  `ct402-api` publishes host `127.0.0.1:8080` to container port 8080, but its API
  is configured for another port. Use inspect and logs to identify the mismatch.
  Preserve named volume `ct402-data`; recreate the same named rootless Apache
  container with `API_PORT=8080`, the same volume at `/srv`, and the exact loopback
  mapping. Leave it running. `/health` must return `CT402 recovered API`.

  Create `/home/student/ct402-incident-report` with exactly:
  `root cause: API_PORT was 9090 while published target was 8080`
  `recovery: recreated ct402-api on 8080 with ct402-data preserved`

  Do not erase the volume, edit the baseline, run a host server, use sudo or
  privileged Podman, disable SELinux, or contact a registry. Setup stages the fault
  only once, so reruns preserve recovery. The preloaded upstream tag is mutable.
  Preserve the original volume object as well as its data: its creation timestamp
  is recorded by setup. Recovery is not complete if the volume was deleted and
  replaced, even with matching text. Confirm the guest's loopback endpoint with
  `curl --noproxy '*' http://127.0.0.1:8080/health` as well as a container-local probe.

  Serve the original `/srv/health` file (exactly `CT402 recovered API` plus newline)
  with `registry.access.redhat.com/ubi9/httpd-24:9.8` in `ct402-api`. Do not replace
  the backing file with a symlink, overlay `/srv`, or serve an independent copy.
  `registry.access.redhat.com/ubi9/ubi:9.8` is also preloaded for helper commands.
  Setup verified internal HTTP on 9090 and failed external HTTP on 8080 before
  recording the fault. `API_PORT` is evidence metadata, not an Apache setting:
  repair `Listen` in `/home/student/ct-httpd.conf` as well as the environment.

  ## Static Apache contract
  Run Apache as the image's default UID 1001. Supply `/tmp/ct-httpd.conf` inside
  the container with exactly the following configuration (including final newline),
  using a readable `:ro,Z` bind from `/home/student/ct-httpd.conf` or a file created
  before startup. Start `/usr/sbin/httpd -f /tmp/ct-httpd.conf -DFOREGROUND`
  instead of the default launcher; `-D FOREGROUND` is also accepted. There are
  no includes, redirects, CGI, aliases, extra modules, or custom command options.
  This constrained static server lets the grader correlate named-container
  listener ownership, effective docroot inode, and exact backing bytes without
  modifying learner data. Finish all configuration edits and permission/label
  changes, wait at least 3 seconds, then start or fully restart the container.
  Configuration changes require a full restart, not a graceful Apache reload;
  merely waiting after an already-started server will not satisfy the check.
  The grader conservatively requires config mtime and ctime to predate every
  Apache process, with a timing margin, and rejects changes during its probe.
  Keep the configuration and process set stable while grading. If Podman's
  automatic `:Z` relabel occurs at launch, wait 3 seconds and restart again.

  ```apache
  ServerRoot "/etc/httpd"
  LoadModule mpm_event_module modules/mod_mpm_event.so
  LoadModule unixd_module modules/mod_unixd.so
  LoadModule authz_core_module modules/mod_authz_core.so
  Listen 8080
  ServerName localhost
  PidFile /tmp/ct-httpd.pid
  ErrorLog /dev/stderr
  DocumentRoot "/srv"
  <Directory "/srv">
      Options FollowSymLinks
      AllowOverride None
      Require all granted
  </Directory>
  ```

  Fresh creation refreshes the required UBI 9.8 minor tags, even if cached.
  Resolved image IDs and repository digests are recorded for diagnostics in
  `/var/lib/labctl/ct-image-provenance`; these are observations, not digest pins.
  Grading never pulls. A reset reuses the saved definition/setup and rebuilds
  guest storage, so its saved tags can resolve to newer bytes. Recreate the lab
  to adopt an updated catalogue; a reset does not migrate old assignments.

  ## Common environment and boundaries
  One Rocky Linux 9 VM named `node` is supplied. Work as `student` using rootless
  Podman and `registry.access.redhat.com/ubi9/httpd-24:9.8` (preloaded in your image store).
  Use `--pull=never` for offline runs. Package/image acquisition during setup needs
  Internet; the upstream image tag is mutable, not digest-pinned. No host container
  engine is used. Keep SELinux confinement intact; never use privileged containers,
  rootful Podman, disabled labels, host networking, or host-service substitutes.
  No guest reboot is required for this lab. Leave all requested evidence in place.
  From the labctl host, run `labctl lab grade CT402` to check your work.
provider: kvm
grader: grade.py
vms:
  - {name: node, cpus: 2, ram: 2GiB, disk: 12GiB, image: 'rocky:9', hostname: ct402.lab, interfaces: [{type: isolated_nat}], setup: setup.sh, depends_on: [], ssh_user: student}
